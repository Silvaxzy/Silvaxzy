<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#0A1A3F">
        <animate attributeName="stop-color" values="#0A1A3F;#2F7BFF;#0A1A3F" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#2F7BFF">
        <animate attributeName="stop-color" values="#2F7BFF;#7FB2FF;#2F7BFF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0A1A3F">
        <animate attributeName="stop-color" values="#0A1A3F;#2F7BFF;#0A1A3F" dur="6s" begin="-3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A66FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A66FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="#000"/>
  <ellipse cx="450" cy="105" rx="330" ry="90" fill="url(#brilho)"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.4s" fill="freeze"/>
    <text x="450" y="118" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="url(#nome)">Bruno Silva</text>
    <text x="450" y="162" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="4" fill="#8A94A6">DESENVOLVEDOR FULL STACK</text>
  </g>
  <rect x="380" y="186" width="140" height="3" rx="1.5" fill="#0A66FF"/>
</svg>
